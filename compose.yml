services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: electronicseal
      MYSQL_USER: electronicseal
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
    volumes:
      - mysql-data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: .
      dockerfile: deploy/backend.Dockerfile
    environment:
      DB_URL: jdbc:mysql://mysql:3306/electronicseal?serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true
      DB_USERNAME: electronicseal
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      CONTRACT_ADDRESS: ${CONTRACT_ADDRESS:?Set CONTRACT_ADDRESS in .env}
      CONTRACT_OWNER_ADDRESS: ${CONTRACT_OWNER_ADDRESS:?Set CONTRACT_OWNER_ADDRESS in .env}
      WEBASE_TRANS_URL: ${WEBASE_TRANS_URL:?Set WEBASE_TRANS_URL in .env}
    extra_hosts:
      - host.docker.internal:host-gateway
    depends_on:
      mysql:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: deploy/frontend.Dockerfile
    ports:
      - "8020:80"
    depends_on:
      - backend

volumes:
  mysql-data:
